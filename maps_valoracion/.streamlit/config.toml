[theme]
base = "light"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseFontSize = 15
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
primaryColor = "#1F3A68"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6FA"
textColor = "#0F172A"
linkColor = "#1F4FA3"
borderColor = "#E2E8F0"
showWidgetBorder = true
showSidebarBorder = true
metricValueFontWeight = 600
greenColor = "#15803D"
redColor = "#B91C1C"
orangeColor = "#B45309"
blueColor = "#1F4FA3"

[theme.sidebar]
backgroundColor = "#0F1B33"
secondaryBackgroundColor = "#18284A"
textColor = "#E6EAF2"
primaryColor = "#7AA7FF"
borderColor = "#253A63"

[server]
maxUploadSize = 50

[client]
toolbarMode = "minimal"
